name: Update Malayalam EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate Malayalam EPG
        env:
          XTREAM_SERVER: ${{ secrets.XTREAM_SERVER }}
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |
          python update_malayalam.py
          gzip -9 -c malayalam.xml > malayalam.xml.gz

      - name: Commit updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add malayalam.xml malayalam.xml.gz
          git rm --cached --ignore-unmatch malayalam.m3u || true
          git diff --cached --quiet || git commit -m "Update Malayalam EPG"
          git push
